services:
  - type: web
    name: jp-admin-self-hosted
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: JP_INSTALLER_MODE
        value: "true"
      - key: CENTRAL_SHEET_URL
        sync: false
      - key: COHORT_TIMEZONE
        value: Asia/Dhaka
      - key: BOT_ACTIVE_WINDOW
        value: always
      - key: BOT_ACTIVE_TIMEZONE
        value: Asia/Dhaka
